name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 是基线；windows 是本项目的主要部署形态（start.cmd / 计划任务 /
        # pkg exe / 注册表通知），必须同缸回归路径分隔符与 spawn 行为差异
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # 先 build：集成测试 spawn 的是 dist/index.js
      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

      # 覆盖率只在基线系统跑一份，避免矩阵重复
      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: npx vitest run --coverage --coverage.reporter=text-summary
