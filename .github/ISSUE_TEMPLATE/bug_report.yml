name: 🐛 BUG 反馈
description: 报告一个缺陷或不正确的行为
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告问题！请提供足够的信息，方便定位和复现。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰、简洁地描述你遇到的问题
      placeholder: 发生了什么？与你预期的有什么不同？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步说明如何复现这个问题
      placeholder: |
        1. 打开…
        2. 点击…
        3. 观察…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望的正确行为是什么
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 版本号、操作系统、运行时（如 Node 版本）等
      placeholder: 例如 v0.1.0 · Windows x64 · Node 20
  - type: textarea
    id: logs
    attributes:
      label: 截图 / 日志
      description: 如有相关截图或错误日志，请粘贴在这里
