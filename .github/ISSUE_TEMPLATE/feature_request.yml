name: ✨ 功能建议
description: 提出一个新功能或改进建议
title: "[需求]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请尽量清晰地描述需求，方便评估。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能是为了解决什么问题
      placeholder: 描述当前痛点或使用场景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望如何实现 / 使用起来是什么样子
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 如果上面的方案不可行，你想过哪些替代做法
  - type: textarea
    id: additional
    attributes:
      label: 其他补充
      description: 需要补充的信息
